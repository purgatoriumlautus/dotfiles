# Hyprland Config - Win98/Chicago95 Theme

################
### MONITORS ###
################

# Device-specific monitor config — uncomment and edit for your setup
# Use `hyprctl monitors` to find your monitor names

# Laptop (single monitor, ASUS FX503VM)
# monitor = eDP-1, preferred, auto, 1

# PC (dual monitor — ASUS VG259QR left, BenQ ZOWIE XL right)
monitor = DP-3, 1920x1080@165, 0x0, 1
monitor = DP-2, 1920x1080@144, 1920x0, 1

# Workspace to monitor binding
workspace = 1, monitor:DP-3
workspace = 2, monitor:DP-3
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2

################
### PROGRAMS ###
################

$terminal = kitty
$launcher = tofi-drun --drun-launch=true
$filemanager = thunar

#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hyprsunset
exec-once = hyprpaper
exec-once = mako
exec-once = hyprpm reload -nn && sleep 0.2 && hyprctl dismissnotify

# Laptop only — uncomment if not using waybar bluetooth module
# exec-once = blueman-applet

# Clipboard manager (cliphist stores text and image history)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
bind = Super, backslash, exec, cliphist list | tofi | cliphist decode | wl-copy

#####################
### ENVIRONMENT ###
#####################

env = XCURSOR_SIZE,48
env = XCURSOR_THEME,Chicago95_Cursor_White
env = GTK_THEME,Chicago95
env = XDG_SESSION_TYPE,wayland

# Hardware cursor settings
# (nouveau driver required no_hardware_cursors = true, AMD works fine without it)
cursor {
    no_hardware_cursors = false
}

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 10
    gaps_out = 4
    border_size = 1

    # Win98 palette: grey active border, silver inactive
    col.active_border = rgba(808080ff)
    col.inactive_border = rgba(c0c0c0ff)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

# Animations disabled for snappy Win98 feel
animations {
    enabled = false
}

input {
    kb_layout = us,ru,ua
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    font_family = Terminess Nerd Font Mono
}

# Window title bars (hyprbars plugin — Win98 style)
plugin {
    hyprbars {
        bar_height = 20
        bar_color = rgb(c0c0c0)
        bar_text_size = 12
        bar_text_font = Terminess Nerd Font Mono
        col.text = rgb(000080)
        bar_part_of_window = true
        bar_precedence_over_border = true
        col.inactive = rgb(808080)
    }
}

# Grouped windows (tabbed layout)
group {
    col.border_active = rgb(000080)
    col.border_inactive = rgb(808080)
    groupbar {
        enabled = true
        height = 20
        font_size = 12
        font_family = Terminess Nerd Font Mono
        text_color = rgb(000000)
        col.active = rgb(c0c0c0)
        col.inactive = rgb(808080)
        render_titles = true
        gradients = false
    }
}

################
### KEYBINDS ###
################

$mod = SUPER

binds {
    movefocus_cycles_fullscreen = true
    movefocus_cycles_groupfirst = true
}

# Application launchers
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $launcher
bind = $mod, E, exec, $filemanager
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exec, ~/.config/hypr/scripts/powermenu.sh

# Brightness — laptop only (desktop monitors use hardware controls)
# bindle = , XF86MonBrightnessUp,   exec, brightnessctl -d nv_backlight set 5%+
# bindle = , XF86MonBrightnessDown, exec, brightnessctl -d nv_backlight set 5%-

# Volume (wpctl = WirePlumber, PipeWire session manager)
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.2 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.2 @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Media — AudioNext toggles pavucontrol (intentional, no dedicated media-next key needed)
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, pkill -x pavucontrol || pavucontrol
bindl  = , XF86AudioPrev, exec, playerctl previous

# Screenshots (grim + slurp + swappy — edit then save to file AND clipboard)
bind = , Print, exec, mkdir -p ~/Pictures/screenshots && grim -g "$(slurp)" - | swappy -f - -o - | tee ~/Pictures/screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/screenshots && grim - | swappy -f - -o - | tee ~/Pictures/screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy

# Screen recording (wf-recorder — toggle on/off)
bind = SUPER, Print, exec, ~/.config/hypr/scripts/record-screen.sh
bind = SUPER SHIFT, Print, exec, ~/.config/hypr/scripts/record-region.sh

# Window focus (vim-style)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Scroll between windows (cycles in fullscreen)
bind = $mod, mouse_down, movefocus, d
bind = $mod, mouse_up, movefocus, u

# Window move
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Window grouping
bind = $mod, G, togglegroup
bind = $mod SHIFT, G, moveoutofgroup
bind = $mod CTRL, H, moveintogroup, l
bind = $mod CTRL, L, moveintogroup, r
bind = $mod CTRL, K, moveintogroup, u
bind = $mod CTRL, J, moveintogroup, d
bind = $mod, Tab, changegroupactive, f
bind = $mod SHIFT, Tab, changegroupactive, b

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Mouse binds (mod + drag)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Toggle floating
bind = $mod, V, togglefloating

# Maximize (keeps waybar visible, unlike fullscreen,0)
bind = $mod, F, fullscreen, 1

# VM passthrough mode — enter with Super+`, only Super+* keys work, rest goes to VM
bind = $mod, grave, submap, vm
submap = vm
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, F, fullscreen, 1
bind = $mod, grave, submap, reset
submap = reset
