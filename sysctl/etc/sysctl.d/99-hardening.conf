# Security hardening - applied via stow
# See: https://wiki.archlinux.org/title/Security#Kernel_hardening

# Hide kernel pointers from non-root users (defeats KASLR bypass)
kernel.kptr_restrict = 1

# Reverse path filtering - drop packets with spoofed source IPs
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable ICMP redirect acceptance (prevents routing table poisoning)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable sending ICMP redirects (not a router)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# SYN flood protection (already on, making it explicit)
net.ipv4.tcp_syncookies = 1

# Keep IP forwarding on - required for Docker
net.ipv4.ip_forward = 1
