#!/usr/sbin/nft -f
# Flush existing rules (start clean)
flush ruleset

# inet = handles both IPv4 and IPv6
table inet filter {

		# INPUT chain: traffic coming INTO your machine
	chain input {
	  # Default policy: DROP everything not explicitly allowed
	  type filter hook input priority filter; policy drop;

	  # Allow loopback (localhost to localhost — never block this)
	  iif lo accept \
	      comment "allow loopback"

	  # Allow established connections to continue
	  # (so your browser responses come back, etc.)
	  ct state established,related accept \
	      comment "allow established connections"

	  # Allow ICMP (ping) — useful for debugging
	  ip  protocol icmp  accept comment "allow ICMPv4"
	  ip6 nexthdr  icmpv6 accept comment "allow ICMPv6"

    udp dport 68 accept comment "allow dhcp"
	  # If you need SSH from anywhere (less secure):
	  # tcp dport 22 accept

	  # Log and drop everything else
	  log prefix "[nft drop] " drop
	}

	# OUTPUT chain: traffic leaving your machine
	chain output {
	  # Allow all outgoing (you initiated it)
    type filter hook output priority filter; policy accept;
	}

	# FORWARD chain: traffic passing through (router use)
	chain forward {
	  # You're not a router — drop all forwarded traffic
    type filter hook forward priority filter; policy drop;
	}
}
